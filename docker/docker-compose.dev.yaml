name: pttbbs-backend-dev

# https://raw.githubusercontent.com/LemmyNet/lemmy-docs/main/assets/docker-compose.yml
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "4"

services:
  init-bbs:
    image: ghcr.io/bbsdocker/imageptt
    command: /srv/pttbbs-backend/scripts/init-ptt.sh /opt/home/bbs
    volumes:
      - type: bind
        source: ..
        target: /srv/pttbbs-backend
      - type: bind
        source: ../docs/examples/home
        target: /opt/home
    working_dir: /opt/home
  init-bbs-clean-run:
    image: ghcr.io/bbsdocker/imageptt
    command: sh -c 'rm -rf /opt/home/bbs/run/*'
    volumes:
      - type: bind
        source: ../docs/examples/home
        target: /opt/home
    depends_on:
      init-bbs:
        condition: service_completed_successfully
  init-bbs-bin:
    # 1. rm -rf /opt/home/bbs/bin
    # 2. cp -R /home/bbs/bin /opt/home/bbs/bin
    # 3. ls /opt/home/bbs/bin
    image: ghcr.io/bbsdocker/imageptt
    command: sh -c 'rm -rf /opt/home/bbs/bin && cp -R /home/bbs/bin /opt/home/bbs/bin && ls /opt/home/bbs/bin'
    volumes:
      - type: bind
        source: ../docs/examples/home
        target: /opt/home
    depends_on:
      init-bbs-clean-run:
        condition: service_completed_successfully
  pttbbs:
    image: ghcr.io/bbsdocker/imageptt
    ports:
      - "127.0.0.1:8888:8888"
    restart: always
    volumes:
      - type: bind
        source: ../docs/examples/home/bbs
        target: /home/bbs
    depends_on:
      init-bbs-bin:
        condition: service_completed_successfully
  go-pttbbs:
    image: pttofficialapps/go-pttbbs:v0.26.5
    ports:
      - "127.0.0.1:3456:3456"
    restart: always
    volumes:
      - type: bind
        source: ../docs/examples/home/bbs
        target: /home/bbs
      - type: bind
        source: ../docs/examples/etc/go-pttbbs
        target: /etc/go-pttbbs
    depends_on:
      pttbbs:
        condition: service_started
  mongo:
    image: mongo:8.0.11
    restart: always
    volumes:
      - type: volume
        source: mongo_data_db
        target: /data/db
      - type: volume
        source: mongo_data_configdb
        target: /data/configdb
    cpus: 1
    mem_limit: 1G
    mem_reservation: 1G
    ports:
      - "127.0.0.1:27017:27017"
  redis:
    image: redis:6.0.9-alpine
    restart: always
    cpus: 1
    mem_limit: 1G
    mem_reservation: 1G
    ports:
      - "127.0.0.1:6379:6379"
  postfix:
    image: chhsiao1981/docker-postfix:v0.2.0
    ports:
      - "127.0.0.1:2255:25"
    volumes:
      - type: bind
        source: ../docs/examples/var/mail
        target: /var/mail
      - type: bind
        source: ../docs/examples/etc/postfix-172.18
        target: /etc/postfix

  # https://raw.githubusercontent.com/LemmyNet/lemmy-docs/main/assets/docker-compose.yml
  lemmy:
    image: docker-lemmy:latest
    hostname: lemmy
    restart: always
    logging: *default-logging
    environment:
      - RUST_LOG=warn,extism=info,lemmy_server=debug,lemmy_api=debug,lemmy_api_common=debug,lemmy_api_crud=debug,lemmy_apub=debug,lemmy_db_schema=debug,lemmy_db_views=debug,lemmy_routes=debug,lemmy_utils=debug,lemmy_websocket=debug
      - LEMMY_DISABLE_ACTIVITY_SENDING=true
      - LEMMY_CONFIG_LOCATION=/config/config.hjson
    volumes:
      - type: bind
        source: ../docs/examples/etc/pttbbs-backend/pttbbs-lemmy/lemmy.hjson
        target: /config/config.hjson
    depends_on:
      - postgres
      - pictrs
    ports:
      - 127.0.0.1:8536:8536
  postgres:
    image: postgres:18.6-alpine3.24
    hostname: postgres
    environment:
      - POSTGRES_USER=SYSOP
      - POSTGRES_PASSWORD=12345678
      - POSTGRES_DB=lemmy-dev
    restart: always
    shm_size: 1g
    volumes:
      - type: volume
        source: postgres_db
        target: /var/lib/postgresql
    logging: *default-logging
    ports:
      - 127.0.0.1:5432:5432
  pictrs:
    image: asonix/pictrs:0.5.24
    # this needs to match the pictrs url in lemmy.hjson
    hostname: pictrs
    # we can set options to pictrs like this, here we set max. image size and forced format for conversion
    # entrypoint: /sbin/tini -- /usr/local/bin/pict-rs -p /mnt -m 4 --image-format webp
    environment:
      - PICTRS_OPENTELEMETRY_URL=http://otel:4137
      - PICTRS__SERVER__API_KEY=12345678
      - RUST_BACKTRACE=full
      - PICTRS__MEDIA__VIDEO__VIDEO_CODEC=vp9
      - PICTRS__MEDIA__ANIMATION__MAX_WIDTH=256
      - PICTRS__MEDIA__ANIMATION__MAX_HEIGHT=256
      - PICTRS__MEDIA__ANIMATION__MAX_FRAME_COUNT=400
    user: 991:991
    volumes:
      - type: volume
        source: pictrs_mnt
        target: /mnt
    restart: always
    logging: *default-logging

  lemmy-ui:
    image: docker-lemmy-ui:latest
    ports:
      - 127.0.0.1:1234:1234
    environment:
      - LEMMY_UI_BACKEND_INTERNAL=lemmy:8536

  pttbbs-lemmy:
    image: pttofficialapps/pttbbs-lemmy:v0.1.1
    ports:
      - "127.0.0.1:8537:8537"
    environment:
      - RUST_LOG=warn,extism=info,lemmy_server=debug,lemmy_api=debug,lemmy_api_common=debug,lemmy_api_crud=debug,lemmy_apub=debug,lemmy_db_schema=debug,lemmy_db_views=debug,lemmy_routes=debug,lemmy_utils=debug,lemmy_websocket=debug
      - LEMMY_DISABLE_ACTIVITY_SENDING=true
      - LEMMY_CONFIG_LOCATION=/config/config.hjson
    volumes:
      - type: bind
        source: ../docs/examples/etc/pttbbs-backend/pttbbs-lemmy/config.hjson
        target: /config/config.hjson

volumes:
  mongo_data_db:
  mongo_data_configdb:

  postgres_db:
  pictrs_mnt: